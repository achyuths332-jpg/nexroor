<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Everyday home and kitchen products at simple prices.">
  <title>Everyday Cart — Home & Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <header class="site-header">
    <div class="container header-inner">
      <button class="brand" data-route="home" aria-label="Everyday Cart home">
        <span class="brand-mark">EC</span>
        <span>Everyday Cart</span>
      </button>
      <div class="header-actions">
        <button class="icon-btn" data-route="orders" aria-label="View orders">Orders</button>
        <button class="cart-btn" data-route="cart" aria-label="Open cart">Cart <span id="cart-count">0</span></button>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <strong>Everyday Cart</strong>
        <p>Useful products for everyday living.</p>
      </div>
      <div>
        <strong>Customer</strong>
        <button data-route="orders">Orders</button>
        <button data-route="cart">Cart</button>
      </div>
      <div>
        <strong>Store note</strong>
        <p>Product images are added only when approved, stable image URLs are available.</p>
      </div>
    </div>
    <div class="container footer-bottom">© <span id="year"></span> Everyday Cart. All rights reserved.</div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
